name: Release

# Builds, tests and packs StrataFx, publishes the packages to nuget.org and creates a GitHub release.
# - Push a tag like v0.1.0 (or v0.2.0-preview.1) to release. The package version comes from the tag.
# - Run it by hand (Actions > Release > Run workflow) to build and pack a version without a tag; it only publishes
#   to nuget.org when "publish" is ticked, and never creates a GitHub release.
# Setup (nuget.org trusted publishing, secrets): see RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, e.g. 0.1.0 or 0.2.0-preview.1"
        required: true
      publish:
        description: "Publish the packages to nuget.org"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a version like 1.2.3 or 1.2.3-preview.1"
            exit 1
          fi
          # Directory.Build.props holds the version for local builds and the template; keep it in step with tags.
          prefix=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${version%%-*}" != "$prefix" ]; then
            echo "::error::Tag v$version does not match VersionPrefix $prefix in Directory.Build.props. Update it first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          echo "Version: $version"

      - name: Restore
        run: dotnet restore StrataFx.sln

      - name: Build
        run: dotnet build StrataFx.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test StrataFx.sln --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: dotnet pack StrataFx.sln --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} --output artifacts

      - name: Check packages
        shell: bash
        run: |
          ls -l artifacts
          for id in StrataFx.Core StrataFx.EFCore StrataFx.Blazor StrataFx.Identity StrataFx.Designer StrataFx.Templates; do
            test -f "artifacts/$id.${{ steps.version.outputs.version }}.nupkg" || { echo "::error::$id package missing"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    # The trusted publishing policy on nuget.org names this environment, so only this job can get a key.
    environment: nuget
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for NuGet trusted publishing
    env:
      # Optional fallback: a nuget.org API key secret, used only when set. Trusted publishing needs no stored key.
      NUGET_API_KEY_SECRET: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      # Exchanges the OIDC token for a nuget.org API key that is valid for one hour.
      - name: NuGet login (trusted publishing)
        id: login
        if: env.NUGET_API_KEY_SECRET == ''
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Also pushes each .snupkg next to its .nupkg to the symbol server.
      - name: Push to nuget.org
        shell: bash
        env:
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY || env.NUGET_API_KEY_SECRET }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

  github-release:
    needs: [build, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${{ needs.build.outputs.version }}"
          # The section from "## [<version>]" up to the next "## [" heading.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $version"
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." > notes.md
          fi
          printf '\n**Packages:** https://www.nuget.org/profiles/stratafx\n' >> notes.md
          cat notes.md

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${{ needs.build.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "StrataFx ${{ needs.build.outputs.version }}" \
            --notes-file notes.md --verify-tag "${flags[@]}"
